<script>

const auth=firebase.auth(),db=firebase.firestore(),TS=()=>firebase.firestore.FieldValue.serverTimestamp();

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function analytics(){try{firebase.analytics()}catch(e){}}   // starts only after the visitor accepts

<script>
let reg=false,busy=false;
const err=c=>({"auth/invalid-credential":"Wrong email or password.","auth/wrong-password":"Wrong email or password.","auth/user-not-found":"No account with that email.","auth/email-already-in-use":"That email already has an account. Sign in instead.","auth/weak-password":"Use at least 6 characters.","auth/popup-closed-by-user":"Sign-in was cancelled.","auth/too-many-requests":"Too many tries. Please wait a few minutes."}[c]||"Something went wrong. Please try again.");
function go(u){const n=new URLSearchParams(location.search).get("next");location.href=isAdmin(u)?"/admin/":(n&&n[0]==="/"&&n[1]!=="/"?n:"/account/")}
onUser(u=>{if(u&&!busy)go(u)});
$("#sw").onclick=e=>{e.preventDefault();reg=!reg;$("#tt").textContent=reg?"Create account":"Sign in";$("#go").textContent=reg?"Create account":"Sign in";$("#sw").textContent=reg?"I already have an account":"Create an account"};
$("#f").onsubmit=async e=>{e.preventDefault();busy=true;
 try{let c;if(reg){c=await auth.createUserWithEmailAndPassword($("#e").value,$("#p").value);await c.user.sendEmailVerification();await db.collection("users").doc(c.user.uid).set({email:c.user.email,createdAt:TS()})}
  else c=await auth.signInWithEmailAndPassword($("#e").value,$("#p").value);go(c.user)}
 catch(x){busy=false;toast(err(x.code),1)}};
$("#g").onclick=async()=>{busy=true;try{const c=await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());await db.collection("users").doc(c.user.uid).set({email:c.user.email,name:c.user.displayName||"",createdAt:TS()},{merge:true});go(c.user)}catch(x){busy=false;toast(err(x.code),1)}};
$("#rs").onclick=async e=>{e.preventDefault();const m=$("#e").value;if(!m)return toast("Type your email first.",1);try{await auth.sendPasswordResetEmail(m);toast("Reset link sent. Check your inbox.")}catch(x){toast(err(x.code),1)}};
</script></body></html>

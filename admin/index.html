<main class="w" style="padding-top:48px;padding-bottom:60px"><h1 style="font-size:36px;margin-bottom:22px">Admin</h1>

<script>

/* ====================== */
firebase.initializeApp({apiKey:"AIzaSyB_j8XBMJNmhofE60p4O46A87U_Y97dP-0",authDomain:"br-constructions.firebaseapp.com",projectId:"br-constructions",storageBucket:"br-constructions.firebasestorage.app",messagingSenderId:"203570854883",appId:"1:203570854883:web:9679ffd8378de32d083ed6",measurementId:"G-T2E266LKCQ"});
const auth=firebase.auth(),db=firebase.firestore(),TS=()=>firebase.firestore.FieldValue.serverTimestamp();
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];

const isAdmin=u=>!!(u&&u.email&&BR.admins.some(e=>e.toLowerCase()===u.email.toLowerCase()));
const onUser=fn=>auth.onAuthStateChanged(fn);

function toast(m,bad){const t=document.createElement("div");t.className="toast"+(bad?" bad":"");t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3600)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function analytics(){try{firebase.analytics()}catch(e){}}   // starts only after the visitor accepts
function chrome(){
  const h=document.createElement("header");

<script>
const ST=["new","contacted","quoted","won","closed"];let rows=[],unsub;
onUser(u=>{if(!isAdmin(u)){$("#no").textContent=u?"This account is not an admin.":"Please sign in as admin.";if(!u)setTimeout(()=>location.href="/login/?next=/admin/",900);return}
 $("#no").classList.add("hid");$("#ok").classList.remove("hid");
 unsub&&unsub();unsub=db.collection("enquiries").orderBy("createdAt","desc").limit(300).onSnapshot(s=>{rows=s.docs.map(d=>({id:d.id,...d.data()}));drawE()},e=>toast("Cannot read enquiries. Check the rules and admin email.",1));
 db.collection("projects").onSnapshot(s=>{$("#pl").innerHTML=s.docs.map(d=>{const p=d.data();return `<div class="card"><span class="tag">${esc(p.type)}</span><h3 style="margin:6px 0">${esc(p.title)}</h3><p>${esc(p.desc)}</p><button class="btn d" data-p="${d.id}" style="margin-top:14px">Delete</button></div>`}).join("")||'<p class="msg">No projects yet. The site shows sample ones until you add your own.</p>'})});
function drawE(){$("#cn").textContent="("+rows.filter(r=>r.status==="new").length+" new)";
 $("#eq").innerHTML=rows.length?`<table><tr><th>Date</th><th>Name</th><th>Contact</th><th>Project</th><th>Status</th><th></th></tr>${rows.map(r=>`<tr><td>${when(r.createdAt)}</td><td>${esc(r.name)}</td><td><a href="tel:${esc(r.phone)}">${esc(r.phone)}</a><br>${esc(r.email)}</td><td><b>${esc(r.type)}</b><br>${esc(r.message)}</td><td><select data-s="${r.id}">${ST.map(s=>`<option ${s===r.status?"selected":""}>${s}</option>`).join("")}</select></td><td><button class="btn d" data-d="${r.id}">Delete</button></td></tr>`).join("")}</table>`:'<p class="msg">No enquiries yet.</p>'}
document.addEventListener("change",e=>{const id=e.target.dataset.s;if(id)db.collection("enquiries").doc(id).update({status:e.target.value}).catch(()=>toast("Update failed",1))});
document.addEventListener("click",e=>{const t=e.target;
 if(t.dataset.d&&confirm("Delete this enquiry?"))db.collection("enquiries").doc(t.dataset.d).delete();
 if(t.dataset.p&&confirm("Delete this project?"))db.collection("projects").doc(t.dataset.p).delete();
 if(t.dataset.t){$$(".tabs [data-t]").forEach(b=>b.classList.toggle("on",b===t));["eq","pj"].forEach(k=>$("#"+k).classList.toggle("hid",k!==t.dataset.t))}});
$("#pf").onsubmit=async e=>{e.preventDefault();try{await db.collection("projects").add({title:$("#pt").value.trim(),type:$("#py").value,desc:$("#pd").value.trim(),createdAt:TS()});e.target.reset();toast("Project added")}catch(x){toast("Could not add project",1)}};
$("#ex").onclick=()=>{const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';const c=[["Date","Name","Phone","Email","Type","Message","Status"].join(",")].concat(rows.map(r=>[when(r.createdAt),r.name,r.phone,r.email,r.type,r.message,r.status].map(q).join(","))).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:"text/csv"}));a.download="enquiries.csv";a.click()};
</script></body></html>
